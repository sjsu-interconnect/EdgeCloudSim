# DAG_APP configuration for Remote RL scheduling - OPTIMIZED FOR REASONABLE COMPLETION TIMES
simulation_time=10000
warm_up_period=5
vm_load_check_interval=0.1
location_check_interval=0.1
file_log_enabled=true
deep_file_log_enabled=false

min_number_of_mobile_devices=50
max_number_of_mobile_devices=50
mobile_device_counter_size=100

wlan_range=50
wan_propagation_delay=0.04
edge_propagation_delay=0.005
lan_internal_delay=0.002
wlan_bandwidth=200
wan_bandwidth=10
gsm_bandwidth=0

# Cloud infrastructure (built-in cloud datacenter)
number_of_host_on_cloud_datacenter=1
number_of_vm_on_cloud_host=16
core_for_cloud_vm=4
mips_for_cloud_vm=10000
ram_for_cloud_vm=4000
storage_for_cloud_vm=100000
# Cloud cost configuration:
# If cloud_cost_per_sec is negative, cloud cost will be derived as:
#   edge_avg_cost_per_sec * cloud_cost_multiplier_vs_edge
#replicate cost mirror
cloud_cost_per_sec=0.000225
cloud_cost_multiplier_vs_edge=0.33
cloud_cost_per_bw=0.000000000333
cloud_cost_per_mem=0.0
cloud_cost_per_storage=0.0

# Mobile processing unit
core_for_mobile_vm=1
mips_for_mobile_vm=1000
ram_for_mobile_vm=1024
storage_for_mobile_vm=10000

# IMPORTANT: enable remote RL orchestrator
orchestrator_policies=REMOTE_RL

# Remote RL service endpoint
rl_service_url=http://127.0.0.1:8000
http_timeout_ms=10000
training_mode=true
rl_reward_mode=estimated
# rl_reward_normalization=minmax
rl_reward_normalization=zscore

# Reward parameters used in Java-side reward computation
alpha_l=1.0
alpha_c=1.0

clip_normalized_reward=true
b_cost=1800.0
budget_penalty=-1.0

simulation_scenarios=TWO_TIER
mobility_model=static

# Mean waiting times by place attractiveness, higher avoids mobility, no use anymore
attractiveness_L1_mean_waiting_time=500000
attractiveness_L2_mean_waiting_time=500000
attractiveness_L3_mean_waiting_time=500000

# DAG arrival process - INCREASED to reduce queuing and achieve 20-80s completion times
dag_interarrival_rate=6.0

# Input DAG dataset path (must be a JSON object or {"dags":[...]} container)
dag_input_path=/Users/arun/Desktop/CS_297/dagsim/src/edu/boun/edgecloudsim/dagsim/synthetic_dags_1k.json

# Reproducibility
rng_seed=42
stop_when_queues_empty=false
